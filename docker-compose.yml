services:
  backend:
    build: ./backend
    container_name: todo-backend
    environment:
      - PORT=5000
      - DATA_DIR=/app/data
    volumes:
      - todo-data:/app/data
    ports:
      - "5000:5000"   # optional: expose API directly
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: todo-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  todo-data:
