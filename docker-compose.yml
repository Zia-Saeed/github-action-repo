services:
  backend:
    image: ziasaeeditgeek/backend-image
    container_name: todo-backend
    environment:
      - PORT=5000
      - DATA_DIR=/app/data
    volumes:
      - todo-data:/app/data
    ports:
      - "5310:5000"   # optional: expose API directly
    restart: unless-stopped

  frontend:
    image: ziasaeeditgeek/frontend-image
    ports:
      - "3434:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  todo-data:
