name: GITHUB-ACTION-DEMO
on:
  push:
    branches:
      - main
env:
  DOCKERHUB_USERNAME: ziasaeeditgeek
jobs:
  GITHUB-ACTION-DEMO:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: echo "hellow World  ${{ github.event_name }} -- ${{ github.ref_name }}"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: $ {{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push Be-Image
        uses: docker/build-push-action@v7
        with: 
          context: ./backend
          push: true
          tags: ziasaeeditgeek/backend-image:latest
      - name: Build and Push FE-Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ziasaeeditgeek/frontend-image:latest
      - name: Execute SSH Commands On Remote Server
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: 'ubuntu@15.252.122.64'
          privateKey: ${{ secrets.SSH_KEY }}
          debug: false
          command: |
            docker pull ziasaeeditgeek/backend-image
            docker pull ziasaeeditgeek/frontend-image
            cd /home/ubuntu/pipeline-compose-file && docker compose build --no-cache 
            docker compose down
            echo "down docker container"
            docker compose rm
            echo "deleted container"
            docker compose pull 
            echo "docker image pull complete"
            docker compose up -d
            echo "image are running successfully"
            sleep 40
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 2 "http://127.0.0.1:3434" || true)
            for attempt in {1..5}
            do 
              if [ "$HTTP_CODE" = "200" ]; then 
                  echo "health check passed"
                  break
              fi
            done 