name: Ci


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ziasaeeditgeek
jobs:
  ci-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4
      - run: echo "HELLO WORLD ${{ github.event_name }} on ${{github.ref_name}}"

      - name: docker hub login
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: echo "login set successfull"
      - name: build and push backend to docker hub 
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/backend-image:latest

      - name: build and push frontend to docker hub
        uses: docker/build-push-action@v7
        with: 
          context: ./frontend
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/frontend-image:latest
      - name: deploy docker image on remote server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e 
            docker pull ziasaeeditgeek/backend-image
            docker pull ziasaeeditgeek/frontend-image
            cd /home/ubuntu/pipeline-compose-file && docker compose build --no-cache 
            docker compose pull 
            echo "docker image pull complete"
            docker compose up -d
            echo "image are running successfully "

