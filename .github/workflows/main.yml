name: Ci


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


jobs:
  ci-flow:
    runs-on: ubuntu-latest
    steps:
      - run: echo "HELLO WORLD ${{ github.event_name }} on ${{github.ref_name}}"
      - run: |
          sh "ls -a"
          docker build -f ./backend/Dockerfile -t backend-image .
          echo "image build complete"
