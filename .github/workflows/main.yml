name: CI


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Triggered by ${{ github.event_name }} on ${{ github.ref_name }}"
      - run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Commit : $GITHUB_SHA"
