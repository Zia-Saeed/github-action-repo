name: Ci


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


jobs:
  ci-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "HELLO WORLD ${{ github.event_name }} on ${{github.ref_name}}"
      - run: |
          ls -a
          cd ./backend
          echo "ls command run successfully"
          docker build -f ./backend/Dockerfile -t backend-image .
          echo "image build complete"
